<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сортировка вставками</title>
    <link rel="stylesheet" href="look.css">
</head>
<body>
    <main class="card">
        <h1>Сортировка вставками</h1>
        <p class="description">Введите числа через пробел и нажмите кнопку.</p>

        <form id="sortForm">
            <label for="arrayInput">Массив</label>
            <input type="text" id="arrayInput" placeholder="Например: 7 3 9 1 5">
            <button type="submit" id="sortButton">Отсортировать</button>
        </form>

        <div id="result"></div>
    </main>

    <script src="logic.js"></script>
</body>
</html>
